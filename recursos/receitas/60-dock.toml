[modulo]
id = "60"
nome = "dock"
titulo = "Dock inferior"
afetada_por = ["dock"]

[[passo]]
tipo = "script"
se = "dock != sim"
dizer = "desligando o dock"
tolera_falha = true
corpo = '''
d3_processo plank
# o plank trata o TERM no laco principal: preso na subida, ele nao sai
pkill -x plank 2>/dev/null || true
for _ in $(seq 50); do pgrep -x -u "$(id -u)" plank >/dev/null || break; sleep 0.1; done
pkill -KILL -x -u "$(id -u)" plank 2>/dev/null && sleep 0.5
if [ -e "$HOME/.config/autostart/plank.desktop" ]; then d3_antes "$HOME/.config/autostart/plank.desktop"; fi
rm -f "$HOME/.config/autostart/plank.desktop"
echo "dock desligado; o pacote continua instalado, religar e imediato"
'''

[[passo]]
tipo = "script"
se = "dock == sim"
dizer = "instalando e configurando o dock"
corpo = '''
# o xfwm4 tira a sombra de janelas do tipo dock quando o plank aparece; anotado
# para o desfazer devolver
d3_xfconf xfwm4 /general/show_dock_shadow bool
# O plank-reloaded instala o executavel como /usr/bin/plank e declara conflito
# com o pacote plank. Detectar pelo binario faria o instalador trocar o fork
# pelo original. Por isso a deteccao e sempre pelo nome do pacote.
instalado(){ [ "$(dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null)" = installed ]; }

pacote=""
if instalado plank-reloaded; then
  pacote=plank-reloaded
else
  # versao fixa e SHA-256 conferido antes de o apt instalar como root
  # (motor.py, PLANK_VERSAO e PLANK_SHA256); sem hash para esta arquitetura,
  # fica o plank do Debian
  if [ -n "$D3_PLANK_SHA256" ]; then
    url="https://github.com/zquestz/plank-reloaded/releases/download/$D3_PLANK_VERSAO/plank-reloaded-debian_${D3_PLANK_VERSAO}-1_$D3_PLANK_ARQUITETURA.deb"
    deb="$D3_FONTES/$(basename "$url")"
    [ -s "$deb" ] || curl -fsSL -o "$deb" "$url" || true
    if [ -s "$deb" ] && ! echo "$D3_PLANK_SHA256  $deb" | sha256sum -c --quiet - >/dev/null 2>&1; then
      echo "o plank-reloaded baixado nao confere com o esperado; nao foi instalado"
      rm -f "$deb"
    fi
    # o .deb esta numa pasta da pessoa: o root copia para uma pasta nova dele,
    # confere o SHA-256 la e instala de la (trocar o arquivo depois da
    # conferencia acima nao chega ao apt)
    if [ -s "$deb" ] && [ ! -L "$deb" ]; then
      r="$(sudo -n mktemp -d)"
      if sudo -n cp --no-preserve=all -- "$deb" "$r/plank-reloaded.deb" \
         && echo "$D3_PLANK_SHA256  $r/plank-reloaded.deb" | sudo -n sha256sum -c --quiet - >/dev/null 2>&1 \
         && sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y \
              -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
              "$r/plank-reloaded.deb" >/dev/null 2>&1; then
        instalado plank-reloaded && pacote=plank-reloaded && d3_pacotes plank-reloaded
      fi
      sudo -n rm -rf -- "$r"
    fi
  fi
  if [ -z "$pacote" ]; then
    echo "plank-reloaded indisponivel, usando o plank do Debian"
    if ! instalado plank; then
      sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y \
        -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold plank >/dev/null 2>&1 || true
      if instalado plank; then d3_pacotes plank; fi
    fi
    instalado plank && pacote=plank
  fi
fi
[ -n "$pacote" ] || { echo "nenhum dock disponivel"; exit 1; }
echo "dock: $pacote"

# O plank 0.11 (o do Debian e o Reloaded) le a configuracao do GSettings
# (net.launchpad.plank.dock.settings, um caminho por dock) e os itens de
# dock1/launchers; o antigo dock1/settings e os .dockitem soltos em dock1 sao
# ignorados, e ele sobe com os lancadores padrao dele.
# Parado antes de mexer: rodando, ele reescreve a lista de itens conforme a
# pasta muda. Sobe de novo no fim deste passo.
# O plank trata o TERM no laco principal, e um plank preso na subida nao sai
# com ele: depois de 5 s vai o KILL. Senao o novo nao consegue o nome no
# D-Bus, desiste, e fica o antigo, vivo e sem desenhar nada.
d3_processo plank
pkill -x plank 2>/dev/null || true
for _ in $(seq 50); do pgrep -x -u "$(id -u)" plank >/dev/null || break; sleep 0.1; done
pkill -KILL -x -u "$(id -u)" plank 2>/dev/null && sleep 0.5

cfg="$HOME/.config/plank/dock1"
d3_antes "$HOME/.config/plank"
mkdir -p "$cfg"
for tema in "$HOME/.local/share/plank/themes" "$HOME/.local/share/plank-reloaded/themes"; do
  d3_antes "$tema/WhiteSur"
  mkdir -p "$tema/WhiteSur"
  cp -f "$D3_ARQUIVOS/plank-dock.theme" "$tema/WhiteSur/dock.theme"
done

# a pasta inteira foi guardada acima: os lancadores de agora saem
lanc="$cfg/launchers"
rm -rf "$lanc"
mkdir -p "$lanc"
itens=""
add(){
  for base in /usr/share/applications "$HOME/.local/share/applications"; do
    if [ -f "$base/$1" ]; then
      printf '[PlankDockItemPreferences]\nLauncher=file://%s/%s\n' "$base" "$1" \
        > "$lanc/${1%.desktop}.dockitem"
      itens="$itens${itens:+, }'${1%.desktop}.dockitem'"
      return 0
    fi
  done
  return 1
}
add firefox-esr.desktop || add firefox.desktop || true
add thunar.desktop || true
add xfce4-terminal.desktop || true
add org.xfce.mousepad.desktop || add mousepad.desktop || true
add xfce4-appfinder.desktop || true
add xfce-settings-manager.desktop || add xfce4-settings-manager.desktop || true

command -v gsettings >/dev/null || echo "gsettings ausente (libglib2.0-bin): o dock sobe com o tamanho e o tema padrao"
esq="net.launchpad.plank.dock.settings:/net/launchpad/plank/docks/dock1/"
pref(){
  command -v gsettings >/dev/null || return 0
  d3_gsettings "$esq" "$1"
  gsettings set "$esq" "$1" "$2" 2>/dev/null || echo "  o plank desta versao nao tem a chave $1"
}
pref dock-items "[$itens]"
pref position bottom
pref alignment center
pref items-alignment center
pref offset 0
pref icon-size 44
pref hide-mode intelligent
pref hide-delay 0
pref unhide-delay 0
pref pressure-reveal false
pref monitor "''"
pref current-workspace-only false
pref lock-items false
pref show-dock-item false
pref theme WhiteSur
pref zoom-enabled true
pref zoom-percent 145
setsid plank >/dev/null 2>&1 < /dev/null &
# so termina com ele de pe (dono do nome no D-Bus): a receita 61 pode
# reinicia-lo logo em seguida, e matar o plank no meio da subida o deixa preso
for _ in $(seq 100); do
  gdbus call --session --dest org.freedesktop.DBus --object-path /org/freedesktop/DBus \
    --method org.freedesktop.DBus.NameHasOwner net.launchpad.plank 2>/dev/null | grep -q true && break
  sleep 0.1
done
echo "dock configurado: $(echo "$itens" | tr -d "'")"
'''

[[passo]]
tipo = "autostart"
se = "dock == sim"
id = "plank"
nome = "Dock"
comando = "plank"
